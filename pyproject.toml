[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-robot-kinematics"
version = "0.1.0"
description = "Planar centerline reconstruction and deformation metrics for soft-robot kinematics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
